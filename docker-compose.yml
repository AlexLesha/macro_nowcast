version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: macropulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-macropulse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: macropulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: macropulse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-macropulse}
      - REDIS_URL=redis://redis:6379/0
      - FRED_API_KEY=${FRED_API_KEY:-}
      - TIINGO_API_KEY=${TIINGO_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${OPENAI_OR_GEMINI_API_KEY:-}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_OR_GEMINI_API_KEY=${OPENAI_OR_GEMINI_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - POLYGON_API_KEY=${POLYGON_API_KEY:-}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - EIA_API_KEY=${EIA_API_KEY:-}
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: macropulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: macropulse-network
